[project]
name = "channel-platform"
version = "1.0.0"
description = "Consolidated channel partner management platform: MCP servers + unified CLI + n8n workflows"
requires-python = ">=3.10"
dependencies = ["mcp>=1.0"]

[project.optional-dependencies]
dashboard = ["fastapi", "uvicorn", "jinja2", "httpx", "pydantic"]

[project.scripts]
channelctl = "channel_platform.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["channel_platform*"]
